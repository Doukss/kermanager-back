server:
  port: 8082
spring:
  application:
    name: agency-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agency_db}
    username: ${DB_USER:immo}
    password: ${DB_PASS:immo_secret}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
