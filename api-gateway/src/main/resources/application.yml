server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates: [Path=/auth/**]
        - id: super-admin-users
          uri: lb://auth-service
          predicates: [Path=/api/super-admin/users/**, /api/super-admin/users]
        - id: super-admin-payments
          uri: lb://payment-service
          predicates: [Path=/api/super-admin/payments/**, /api/super-admin/payments]
        - id: super-admin-disputes
          uri: lb://dispute-service
          predicates: [Path=/api/super-admin/disputes/**, /api/super-admin/disputes]
        - id: super-admin-agency
          uri: lb://agency-service
          predicates: [Path=/api/super-admin/**]
        - id: agency-service
          uri: lb://agency-service
          predicates: [Path=/api/agencies/**]
        - id: property-service
          uri: lb://property-service
          predicates: [Path=/api/properties/**, /api/contracts/**]
        - id: payment-service
          uri: lb://payment-service
          predicates: [Path=/api/payments/**]
        - id: dispute-service
          uri: lb://dispute-service
          predicates: [Path=/api/disputes/**]

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET:defaultSecretForDevOnly32Chars!!}
  expiration-ms: 86400000
