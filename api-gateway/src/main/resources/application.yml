server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates: [Path=/auth/**]
        - id: agency-service
          uri: lb://agency-service
          predicates: [Path=/api/agencies/**]
        - id: property-service
          uri: lb://property-service
          predicates: [Path=/api/properties/**, /api/contracts/**]
        - id: payment-service
          uri: lb://payment-service
          predicates: [Path=/api/payments/**]
        - id: dispute-service
          uri: lb://dispute-service
          predicates: [Path=/api/disputes/**]

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET:defaultSecretForDevOnly32Chars!!}
  expiration-ms: 86400000
