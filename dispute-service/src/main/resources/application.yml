server:
  port: 8085
spring:
  application:
    name: dispute-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kermanager}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:passer0412}
  jpa:
    hibernate:
      ddl-auto: validate
